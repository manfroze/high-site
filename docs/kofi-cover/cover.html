<!doctype html>
<!--
  Ko-fi cover (1200x400) built from the same tile vocabulary as the
  .icon-column strip in src/pages/index.astro: cyan/pink multiply squares,
  solid reds, rotated red diamonds, two-tone triangles, the odd empty cell,
  and the anti-clump rule against the left and upper neighbour.

  ?seed=N picks a layout, ?size=N the tile size in px (default 100).
  Render with: shot "file://$PWD/cover.html?seed=7" kofi-cover.png --size 1200x400 --scale 1
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #fff; }
  #cover { position: relative; width: 1200px; height: 400px; overflow: hidden; background: #fff; }
  #cover div { position: absolute; }
</style>
</head>
<body>
<div id="cover"></div>
<script>
  const params = new URLSearchParams(location.search);
  const seed = Number(params.get('seed') ?? 7);
  const size = Number(params.get('size') ?? 100);

  // mulberry32: same seed, same cover
  let s = seed >>> 0;
  function random() {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  const CYAN = '#92f0ed';
  const PINK = '#ebb0ff';
  const RED = '#e70006';
  const HEX = { cyan: CYAN, pink: PINK, red: RED };

  const cover = document.getElementById('cover');
  const cols = Math.ceil(1200 / size);
  const rows = Math.ceil(400 / size);
  const total = cols * rows;

  function pickColor() {
    const r = random();
    if (r < 0.06) return 'red';
    if (r < 0.53) return 'cyan';
    return 'pink';
  }

  function pickTile() {
    const roll = random();
    if (roll < 0.07) return 'empty';
    let c1 = pickColor();
    if (roll < 0.50) return c1 === 'red' ? 'red' : c1 + '1';
    let c2 = pickColor();
    if (c1 === 'red' && c2 === 'red') c2 = random() < 0.5 ? 'cyan' : 'pink';
    // Cyan multiplied over red goes maroon; the strip allows it, a cover shouldn't
    if (c1 === 'red' && c2 === 'cyan') c2 = 'pink';
    if (c2 === 'red' && c1 === 'cyan') c1 = 'pink';
    return c1 + '+' + c2;
  }

  function colorsOf(t) {
    if (t === 'empty') return ['empty'];
    if (t === 'diamond') return ['red'];
    if (t === 'triangle') return ['pink', 'cyan'];
    if (t === 'diamond+triangle') return ['red', 'pink', 'cyan'];
    if (t === 'red') return ['red'];
    if (t === 'cyan1') return ['cyan'];
    if (t === 'pink1') return ['pink'];
    return t.split('+');
  }

  const overlaps = (a, b) => a.some((c) => b.includes(c));

  // Spread diamonds and triangles evenly, with jitter, as the strip does
  function evenSlots(rate, start) {
    const slots = new Set();
    const interval = Math.floor(total / Math.max(1, Math.round(total * rate)));
    for (let i = Math.floor(interval * start); i < total; i += interval) {
      const j = i + Math.floor((random() - 0.5) * Math.floor(interval * 0.4));
      if (j >= 0 && j < total) slots.add(j);
    }
    return slots;
  }
  const diamondSlots = evenSlots(0.06, 1 / 2);
  const triangleSlots = evenSlots(0.07, 1 / 3);

  const types = [];
  for (let i = 0; i < total; i++) {
    let pick;
    if (diamondSlots.has(i) && triangleSlots.has(i)) pick = 'diamond+triangle';
    else if (diamondSlots.has(i)) pick = 'diamond';
    else if (triangleSlots.has(i)) pick = 'triangle';
    else {
      pick = pickTile();
      // Anti-clump against the left neighbour (same row) and the tile above
      const left = i % cols ? types[i - 1] : null;
      const above = types[i - cols];
      for (let n = 0; n < 20 && (
        (left && overlaps(colorsOf(pick), colorsOf(left))) ||
        (above && overlaps(colorsOf(pick), colorsOf(above)))
      ); n++) {
        // An empty never clashes, so rerolls would pile them up
        do pick = pickTile(); while (pick === 'empty');
      }
    }
    types.push(pick);
  }

  function square(x, y, color, extra = '') {
    const el = document.createElement('div');
    el.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${color};` +
      (color === RED ? '' : 'mix-blend-mode:multiply;') + extra;
    cover.appendChild(el);
  }

  function triangle(x, y) {
    square(x, y, PINK, 'clip-path:polygon(100% 0%,0% 100%,100% 100%);');
  }

  function diamond(x, y) {
    const el = document.createElement('div');
    el.style.cssText = `left:${x + size * 0.15}px;top:${y + size * 0.15}px;` +
      `width:${size * 0.7}px;height:${size * 0.7}px;background:${RED};transform:rotate(45deg);`;
    cover.appendChild(el);
  }

  types.forEach((type, i) => {
    const x = (i % cols) * size;
    const y = Math.floor(i / cols) * size;

    if (type === 'empty') return;
    if (type === 'diamond') return diamond(x, y);
    if (type === 'diamond+triangle') {
      square(x, y, CYAN);
      triangle(x, y);
      return diamond(x, y);
    }
    if (type === 'triangle') {
      const bgs = [[CYAN], [RED], [CYAN, CYAN], [CYAN, PINK]][Math.floor(random() * 4)];
      bgs.forEach((c) => square(x, y, c));
      return triangle(x, y);
    }
    colorsOf(type).forEach((c) => square(x, y, HEX[c]));
  });
</script>
</body>
</html>
